name: Production Release
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: production-release, cancel-in-progress: false}
jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - run: supabase init
      - run: cp migrations/202608010005_phase5_launch.sql supabase/migrations/202608010005_phase5_launch.sql
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}", SUPABASE_PROJECT_REF: "${{ secrets.SUPABASE_PROJECT_REF }}"}
      - run: supabase db push
        env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
      - run: supabase migration list
        env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
  tag:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git tag "release-$(date -u +%Y%m%d%H%M%S)" && git push --tags
