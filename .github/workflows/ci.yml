name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install pip-audit==2.9.0
      - run: python -m pytest -q
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-service-key
          JWT_SECRET: placeholder-jwt-secret-at-least-32-characters
          API_KEY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - run: python -m compileall -q .
      - run: pip-audit -r requirements.txt
  sdk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sdks/node}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
